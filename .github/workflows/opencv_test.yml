name: OpenCV Color Detection Test

on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Build Docker image
        run: docker build -t opencv-test ./opencv
        
      - name: Run tests
        run: docker run --rm opencv-test
